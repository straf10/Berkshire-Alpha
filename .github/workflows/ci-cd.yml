name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'agent/**'
              - 'requirements.txt'
              - 'Dockerfile'
              - 'pytest.ini'
            frontend:
              - 'web/**'

  test-backend:
    name: Test backend (pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest -m "not live"
        env:
          APCA_API_KEY_ID: test-key-id
          APCA_API_SECRET_KEY: test-secret-key

  test-frontend:
    name: Test frontend (lint + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # Raised from 5. NOT because this job costs five minutes -- it does not.
    # Measured on run 33816289384: `npm ci` 11s, whole job 44s. The failure
    # mode is `npm ci` STALLING outright, with no error of its own, right
    # after the eslint deprecation warning. It did that twice in a row on run
    # 33815166397 and on every frontend-touching merge back to 33736898502
    # (33745523654, 33749531077, 33755233725), all of which read as
    # "cancelled" -- this cap firing, not a test failing.
    #
    # So the cap is not sized to the work, it is sized to absorb a transient
    # registry stall. That matters because deploy-frontend `needs` this job:
    # under a 5-minute cap a stall does not just redden a badge, it silently
    # skips the Vercel deploy and lets main and the live dashboard drift apart
    # on exactly the merges that changed the dashboard.
    #
    # Do not "fix" this by trimming dependencies. The tree is not the problem.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  deploy-backend:
    name: Deploy backend to Railway
    needs: [changes, test-backend]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - run: railway up --service "$RAILWAY_SERVICE" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: [changes, test-frontend]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true' &&
      !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    # Same reasoning as test-frontend: this job installs the Vercel CLI and
    # runs a production build of the same tree under the same cap.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
